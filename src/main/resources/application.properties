spring.application.name=alert-engine
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSX,UTC} %-5level service=${spring.application.name:alert-engine} traceId=%X{traceId:-} spanId=%X{spanId:-} correlationId=%X{correlationId:-} userId=%X{userId:-} [%thread] %logger{36} - %msg%n

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.schemas=public

server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
management.newrelic.api-key=${NEW_RELIC_API_KEY:}
management.newrelic.account-id=${NEW_RELIC_ACCOUNT_ID:}
management.newrelic.uri=${NEW_RELIC_METRICS_URI:https://insights-collector.newrelic.com}
management.newrelic.step=1m


spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:https://your-domain.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audience=${JWT_AUDIENCE:your-api-identifier}
serviceaccount.client-id=${PRICEFETCHER_CLIENT_ID:test-client-id}
serviceaccount.client-secret=${PRICEFETCHER_CLIENT_SECRET:test-client-secret}
serviceaccount.scope=${SCOPE_AUTH0:}

spring.profiles.active=auth

env.JWT_USER_ID_CLAIM=${JWT_USER_ID_CLAIM}

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/docs
springdoc.api-docs.enabled=true

alertengine.scheduler.cadence=PT60S
alertengine.scheduler.max-parallel-evaluations=4
alertengine.scheduler.history-lookback=200

notification.base-url=${NOTIFICATION_BASE_URL:http://localhost:8085}
notification.alert-path=${NOTIFICATION_ALERT_PATH:/api/v1/notify/alert}
notification.alert-template-key=${NOTIFICATION_ALERT_TEMPLATE_KEY:alert-default}
